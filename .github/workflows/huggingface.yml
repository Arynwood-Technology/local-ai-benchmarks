name: Mirror to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "machine-tests/**"
      - "huggingface/**"
      - "CITATION.cff"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.2.0
      - run: python3 huggingface/build.py
      - run: python3 huggingface/publish.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
